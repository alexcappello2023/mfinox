name: Diagnostica WordPress

# Sola lettura: elenca le categorie del sito con ID, slug e lingua, e mostra
# le categorie effettivamente assegnate agli articoli indicati. Serve quando
# l'esito su WordPress non corrisponde a quello che dicono i log.
on:
  workflow_dispatch:
    inputs:
      post_ids:
        description: "ID degli articoli da ispezionare, separati da virgola"
        required: false
        default: "8787,8789,8791"

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Ispeziona il sito
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_BASE_URL: ${{ vars.WP_BASE_URL || 'https://mfinox.com' }}
        run: python scripts/diagnostica_wp.py --post-ids "${{ inputs.post_ids }}"
