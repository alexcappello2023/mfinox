name: Pubblica bozza su WordPress

# Due modi di partire:
#  - automatico: appena un .md arriva in content/ sul branch main
#  - manuale: per rilanciare, provare a vuoto o forzare una categoria
#
# In entrambi i casi lo script salta gli articoli il cui slug esiste già su
# WordPress, quindi rieseguirlo non crea duplicati.
on:
  push:
    branches: [main]
    paths:
      - "content/**.md"
  workflow_dispatch:
    inputs:
      articolo:
        description: "Percorso di un singolo .md. Vuoto = valuta tutta la cartella content/"
        required: false
        default: ""
      stato:
        description: "Stato dell'articolo su WordPress"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - pending
      categoria:
        description: "Categoria WordPress (nome, es. News). Vuoto = usa il front matter"
        required: false
        default: ""
      dry_run:
        description: "Prova a vuoto, senza chiamare WordPress"
        required: false
        default: false
        type: boolean
      aggiorna_foglio:
        description: "Segna la riga come INSERITO nel Google Sheet"
        required: false
        default: true
        type: boolean

# Due push ravvicinati non devono elaborare la stessa cartella in parallelo:
# il controllo anti-duplicato interroga WordPress prima di scrivere, e due
# esecuzioni sovrapposte potrebbero passarlo entrambe.
concurrency:
  group: pubblica-bozze-wordpress
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Carica le bozze
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_BASE_URL: ${{ vars.WP_BASE_URL || 'https://mfinox.com' }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: scripts
          ARTICOLO: ${{ inputs.articolo }}
          STATO: ${{ inputs.stato || 'draft' }}
          CATEGORIA: ${{ inputs.categoria }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Sui push il foglio si aggiorna sempre; a mano decide la spunta.
          AGGIORNA_FOGLIO: ${{ github.event_name != 'workflow_dispatch' || inputs.aggiorna_foglio }}
        run: |
          ARGS=()
          if [ -n "$ARTICOLO" ]; then
            ARGS+=(--file "$ARTICOLO")
          else
            ARGS+=(--cartella content)
          fi
          if [ -n "$CATEGORIA" ]; then
            ARGS+=(--categoria "$CATEGORIA")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$AGGIORNA_FOGLIO" != "true" ]; then
            ARGS+=(--no-sheet)
          fi
          python scripts/publish_to_wordpress.py "${ARGS[@]}" --status "$STATO"
