name: Piano editoriale (Google Sheet)

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Operazione da eseguire sul foglio"
        required: true
        default: "elenco"
        type: choice
        options:
          - semina    # popola il foglio dal CSV, senza duplicare i titoli
          - prossimo  # mostra il prossimo argomento DA FARE
          - elenco    # stato di tutte le righe

jobs:
  piano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Esegui
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/piano_editoriale.py "${{ inputs.comando }}"
